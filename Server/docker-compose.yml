name: lms-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_platform
    ports:
      - "5432:5432"
    volumes:
      - learnora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  learnora_pgdata:
    name: lms-platform_learnora_pgdata
